"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
run_mode = "concurrent"

[scripts.run.build]
command = "xcodebuild -project App.xcodeproj -scheme App -configuration Debug build"
default = true
icon = "hammer"

[scripts.run.test]
command = "xcodebuild test -project App.xcodeproj -scheme App"
icon = "test-tube"
